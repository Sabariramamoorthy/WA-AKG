# CloudShift Phase 1 baseline — work around broken Docker bridge inter-container routing
# by publishing DB/Redis to the host and attaching the app with host networking.
services:
  invoicerr_db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  invoicerr:
    network_mode: host
    # host network cannot use the compose-published 80:80 mapping; listen on 8080 via nginx or APP
    # The image nginx listens on 80 inside the container; with host mode that is host:80.
    environment:
      - DATABASE_URL=postgresql://invoicerr:${POSTGRES_PASSWORD}@127.0.0.1:5432/invoicerr_db
      - APP_URL=http://127.0.0.1:80
      - CORS_ORIGINS=http://127.0.0.1:80,http://localhost:80,http://127.0.0.1:8080,http://localhost:8080
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - WORKER_INLINE=true
      - MAIL_PROVIDER=
      - SMTP_HOST=
      - SMTP_USER=
      - SMTP_FROM=
      - SMTP_PASSWORD=
      - SMTP_PORT=
      - SMTP_SECURE=
      - OIDC_NAME=
      - OIDC_DISCOVERY_URL=
      - OIDC_END_SESSION_ENDPOINT=
      - OIDC_CLIENT_ID=
      - OIDC_CLIENT_SECRET=
    ports: !reset []
